<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>クラッシュアイス もようカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one screen — hex board on top, pattern chips under it, counts and actions below */
:root{
  --bg:#eaf4fb; --panel:#ffffff; --fg:#14324a; --muted:#5b7890;
  --accent:#1f7ac4; --line:#c9dcea; --warn:#e2463a;
  --ice-blue:#2f7fd6; --ice-white:#f7fbfe; --frame:#7cc4ee; --cell-edge:#14324a;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1b26; --panel:#15293a; --fg:#e4f1fa; --muted:#8fb0c7;
  --accent:#5fb4f2; --line:#25425a; --warn:#ff6a5c; --frame:#2d6f99; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1b26; --panel:#15293a; --fg:#e4f1fa; --muted:#8fb0c7;
  --accent:#5fb4f2; --line:#25425a; --warn:#ff6a5c; --frame:#2d6f99; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;box-sizing:border-box}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
h1{font-size:1.25rem;font-weight:800;margin:0;letter-spacing:.04em;text-wrap:balance}
.name{font-size:clamp(1.6rem,7vw,2.2rem);font-weight:800;margin:0;min-height:2.6rem;text-align:center}
.board{width:min(92vw,500px,58vh);max-width:100%;aspect-ratio:1}
.board svg{width:100%;height:100%;display:block;touch-action:manipulation}
.cell{cursor:pointer;transition:fill .15s}
.counts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.chip i{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--cell-edge);display:inline-block}
.chip.over{border-color:var(--warn);color:var(--warn)}
.patterns{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;width:100%}
button{font-family:inherit;cursor:pointer}
.pat{font-size:1rem;font-weight:800;padding:12px 8px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--fg)}
.pat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.small{font-size:.95rem;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.note{color:var(--muted);font-size:.85rem;margin:0;text-align:center;max-width:36em}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>クラッシュアイス もようカード</h1>
  <p class="name" id="name">かざぐるま</p>
  <div class="board" id="board" aria-label="ブロックのならべかた"></div>
  <div class="counts">
    <span class="chip" id="cBlue"><i style="background:var(--ice-blue)"></i>青 <b>19</b>こ</span>
    <span class="chip" id="cWhite"><i style="background:var(--ice-white)"></i>白 <b>18</b>こ</span>
  </div>
  <div class="patterns" id="patterns"></div>
  <div class="actions">
    <button class="small" id="swap">青と白を入れかえ</button>
    <button class="small" id="clear">ぜんぶ白にして自分で作る</button>
  </div>
  <p class="note">ブロックをタップすると色が変わります。37マスの盤に、青と白を19こまで使います（1こあまります）。まんなかはペンギンが乗るところです。</p>
  <p class="note"><a href="../roulette/">ルーレットへ</a></p>
</main>

<script>
// 盤：上下がとがった六角形の枠に、頭のとがったマスを横の列で並べる。
// 列ごとのマスの数（上から）。合計37。実物と違ったらここを直す
const ROWS = [1,4,5,6,5,6,5,4,1];
const cells = [];
ROWS.forEach((w,i)=>{
  const r = i - (ROWS.length-1)/2;
  for (let j=0;j<w;j++){ const q = (j-(w-1)/2) - r/2; cells.push({q:Math.round(q), r}); }
});
// 軸座標(q,r)、まんなかからの距離 d
const dist = (q,r)=>Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r));
const xy = (q,r)=>[Math.sqrt(3)*(q+r/2), 1.5*r];
const ang = (q,r)=>{ const [x,y]=xy(q,r); return ((Math.atan2(y,x)*180/Math.PI)%360+360)%360; };
const sector = (q,r,tw=0)=>Math.floor((ang(q,r)+tw*dist(q,r)+0.01)/60)%6;

// それぞれ true のマスが青。どれも青19・白18になるように作ってある
const PATTERNS = [
  {name:"かざぐるま", f:(q,r)=>dist(q,r)===0 || sector(q,r)%2===0},
  {name:"うずまき",  f:(q,r)=>dist(q,r)===0 || sector(q,r,20)%2===0},
  {name:"ほし",      f:(q,r)=>dist(q,r)<=1 || q===0 || r===0 || q+r===0 || dist(q,r)===4},
  {name:"まんまる",  f:(q,r)=>dist(q,r)<=2},
  {name:"ドーナツ",  f:(q,r)=>dist(q,r)===1 || dist(q,r)===2},
  {name:"はんぶんこ", f:(q,r)=>r<0 || (r===0 && q>=0)},
  {name:"ランダム",  random:true},
];

let state = []; // true = 青
let current = 0;

const svgNS = "http://www.w3.org/2000/svg";
const S = 30; // マスの大きさ
const board = document.getElementById("board");
const svg = document.createElementNS(svgNS,"svg");
svg.setAttribute("viewBox","-215 -215 430 430");
board.appendChild(svg);
const g = document.createElementNS(svgNS,"g");
svg.appendChild(g);

function hexPoints(cx,cy,s,flat=true){
  const p=[]; for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i+(flat?0:30)); p.push((cx+s*Math.cos(a)).toFixed(1)+","+(cy+s*Math.sin(a)).toFixed(1)); } return p.join(" ");
}
// 外わく（盤）
const frame = document.createElementNS(svgNS,"polygon");
// 外わく：一番外のマスの角を囲む上下がとがった六角形
{ const ys = cells.map(c=>xy(c.q,c.r)[1]), xs = cells.map(c=>xy(c.q,c.r)[0]);
  const top = Math.min(...ys)*S - S*1.7, bottom = Math.max(...ys)*S + S*1.7;
  const side = Math.max(...xs)*S + S*1.25, k = side/Math.sqrt(3);
  frame.setAttribute("points", [[0,top],[side,top+k],[side,bottom-k],[0,bottom],[-side,bottom-k],[-side,top+k]].map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")); }
frame.setAttribute("fill","var(--frame)");
frame.setAttribute("stroke","var(--cell-edge)"); frame.setAttribute("stroke-width","4"); frame.setAttribute("stroke-linejoin","round");
g.appendChild(frame);

const polys = cells.map((c,i)=>{
  const [x,y] = xy(c.q,c.r);
  const p = document.createElementNS(svgNS,"polygon");
  p.setAttribute("points", hexPoints(x*S,y*S,S*0.94,false));
  p.setAttribute("class","cell");
  p.setAttribute("stroke","var(--cell-edge)"); p.setAttribute("stroke-width","2.5"); p.setAttribute("stroke-linejoin","round");
  p.addEventListener("click", ()=>{ state[i] = !state[i]; current = -1; render(); });
  g.appendChild(p);
  return p;
});
// ペンギンの目印
const peng = document.createElementNS(svgNS,"text");
peng.setAttribute("x","0"); peng.setAttribute("y","2"); peng.setAttribute("text-anchor","middle");
peng.setAttribute("dominant-baseline","middle"); peng.setAttribute("font-size","30"); peng.setAttribute("pointer-events","none");
peng.textContent = "🐧";
svg.appendChild(peng);

function render(){
  polys.forEach((p,i)=> p.setAttribute("fill", state[i] ? "var(--ice-blue)" : "var(--ice-white)"));
  const blue = state.filter(Boolean).length, white = state.length - blue;
  const cb = document.getElementById("cBlue"), cw = document.getElementById("cWhite");
  cb.querySelector("b").textContent = blue; cw.querySelector("b").textContent = white;
  cb.classList.toggle("over", blue>19); cw.classList.toggle("over", white>19);
  document.getElementById("name").textContent = current>=0 ? PATTERNS[current].name : "じぶんで作る";
  document.querySelectorAll(".pat").forEach((b,i)=> b.setAttribute("aria-pressed", String(i===current)));
}

function apply(i){
  current = i;
  const p = PATTERNS[i];
  if (p.random){
    const idx = cells.map((_,k)=>k);
    for (let k=idx.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [idx[k],idx[j]]=[idx[j],idx[k]]; }
    const blueN = Math.random()<.5 ? 19 : 18;
    state = cells.map(()=>false); idx.slice(0,blueN).forEach(k=>state[k]=true);
  } else {
    state = cells.map(c=>!!p.f(c.q,c.r));
  }
  render();
}

const wrap = document.getElementById("patterns");
PATTERNS.forEach((p,i)=>{
  const b = document.createElement("button");
  b.className = "pat"; b.textContent = p.name; b.id = "pat"+i;
  b.onclick = ()=>apply(i);
  wrap.appendChild(b);
});
document.getElementById("swap").onclick = ()=>{ state = state.map(v=>!v); render(); };
document.getElementById("clear").onclick = ()=>{ state = cells.map(()=>false); current = -1; render(); };

apply(0);
</script>
</body>
</html>
